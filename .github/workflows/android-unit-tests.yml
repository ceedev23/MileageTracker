name: Android unit tests (dev)

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out dev commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'

      - name: Install project SDK
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0"

      - name: Run debug unit tests
        run: bash ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Summarize test results
        if: always()
        shell: python
        run: |
          import glob
          import os
          import xml.etree.ElementTree as ET

          files = glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Android unit tests on dev\n\n")
              if not files:
                  summary.write("No test results were generated. Check the setup and build logs; tests may not have started.\n")
              else:
                  totals = dict(tests=0, failures=0, errors=0, skipped=0)
                  for path in sorted(files):
                      suite = ET.parse(path).getroot()
                      for key in totals:
                          totals[key] += int(suite.get(key, 0))
                      summary.write(f"- {suite.get('name')}: {suite.get('tests', '0')} tests, {suite.get('failures', '0')} failures, {suite.get('errors', '0')} errors, {suite.get('skipped', '0')} skipped\n")
                  summary.write("\nTotals: " + ", ".join(f"{value} {key}" for key, value in totals.items()) + "\n")

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-results-${{ github.run_id }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
