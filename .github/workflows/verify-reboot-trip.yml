name: Verify trip recording after reboot

on:
  push:
    branches: [verify-reboot-trip]

permissions:
  actions: read
  contents: read

jobs:
  reboot-trip:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'
      - name: Download the debug APK built from dev commit 1653ac3
        uses: actions/download-artifact@v4
        with:
          name: mileagetracker-dev-debug-apk-44617352301
          run-id: 44617352301
          github-token: ${{ github.token }}
      - name: Install and start Android 16 emulator
        run: |
          set -euo pipefail
          sudo chown "$USER" /dev/kvm
          image='system-images;android-36;google_apis;x86_64'
          sdkmanager 'emulator' "$image"
          avdmanager create avd --force --name voomlogs-test --package "$image" <<< no
          nohup "$ANDROID_HOME/emulator/emulator" @voomlogs-test -no-window -noaudio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 </dev/null &
          timeout 240 bash -c 'adb wait-for-device && until [[ $(adb shell getprop sys.boot_completed | tr -d "\r") == 1 ]]; do sleep 2; done'
          adb shell input keyevent 82
      - name: Reboot, simulate a drive, and check the saved trip
        run: |
          set -euo pipefail
          pkg=com.aistudio.mileagetracker.kxmpzq
          is_monitoring() {
            adb shell dumpsys activity services "$pkg" | grep -F 'isForeground=true' >/dev/null
          }
          apk=$(find . -name app-debug.apk -print -quit)
          test -f "$apk"
          adb install -g "$apk"
          adb shell pm grant "$pkg" android.permission.ACCESS_BACKGROUND_LOCATION
          adb shell am start -W -n "$pkg/com.example.MainActivity"
          adb shell input keyevent KEYCODE_HOME
          for i in $(seq 1 30); do
            if is_monitoring; then break; fi
            sleep 2
          done
          is_monitoring
          before_boot=$(adb shell cat /proc/sys/kernel/random/boot_id | tr -d '\r')
          adb reboot
          timeout 240 bash -c 'adb wait-for-device && until [[ $(adb shell getprop sys.boot_completed | tr -d "\r") == 1 ]]; do sleep 2; done'
          test "$(adb shell cat /proc/sys/kernel/random/boot_id | tr -d '\r')" != "$before_boot"
          adb shell input keyevent 82
          for i in $(seq 1 60); do
            if is_monitoring; then break; fi
            sleep 2
          done
          is_monitoring
          echo 'Android rebooted into a new kernel boot ID. The foreground tracking service restarted before any app launch.'
          python3 - <<'PY'
          import subprocess
          import time

          def fix(longitude, speed):
              subprocess.run(
                  ["adb", "emu", "geo", "fix", str(longitude), "43.444", "0", "8", str(speed)],
                  check=True, stdout=subprocess.DEVNULL
              )

          for _ in range(8):
              fix(-79.697, 0)
              time.sleep(2)

          for sample in range(1, 41):
              longitude = -79.697 + sample * 0.00030
              fix(longitude, 28)
              time.sleep(2)

          for _ in range(175):
              fix(longitude, 0)
              time.sleep(2)
          PY
          adb exec-out run-as "$pkg" cat databases/mileage_tracker_db > "$RUNNER_TEMP/trips.db"
          adb exec-out run-as "$pkg" cat databases/mileage_tracker_db-wal > "$RUNNER_TEMP/trips.db-wal"
          python3 - "$RUNNER_TEMP/trips.db" <<'PY'
          import sqlite3
          import sys

          with sqlite3.connect(sys.argv[1]) as database:
              trips = database.execute("SELECT startDate, endDate, distanceKm FROM trips").fetchall()
          print("Trips saved before opening VoomLogs after the reboot:", trips)
          assert len(trips) == 1 and 0.25 <= trips[0][2] <= 1.5, trips
          PY
          if adb logcat -b events -d | grep -E 'wm_(create|resume)_activity.*com\.aistudio\.mileagetracker\.kxmpzq' ; then
            echo 'VoomLogs was opened after reboot.'
            exit 1
          fi
      - name: Show emulator diagnostics if the test fails
        if: failure()
        run: |
          tail -100 "$RUNNER_TEMP/emulator.log" || true
          timeout 15 adb shell dumpsys activity services com.aistudio.mileagetracker.kxmpzq || true
          timeout 15 adb logcat -d -s TrackingService TrackingManager AndroidRuntime || true
